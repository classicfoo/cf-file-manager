[package]
name = "cf-file-manager"
version = "0.1.0"
edition = "2024"
description = "A simple cross-platform desktop file manager built with Rust and egui"
license = "MIT"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui-classic95 = { git = "https://github.com/classicfoo/egui-classic95.git", rev = "b923f0d840518d8769ec7399f6102815a286e712" }
open = "5.3"

[target.'cfg(target_os = "linux")'.dependencies]
egui_extras = { version = "0.37", default-features = false, features = ["svg"] }
freedesktop-icons = "0.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52.0", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_UI_Shell",
] }
